<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit &amp; Sleep Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div class="namefield">
    <label class="label" for="name">Name</label>
    <input id="name" type="text" placeholder="Type your name" autocomplete="name" spellcheck="false">
  </div>

  <div class="top">
    <h1>Habit &amp; Sleep Tracker</h1>
    <p>Answer the daily question, or tap a box: blue is done, red is missed.</p>
    <button class="ghost solid" id="dl" type="button" hidden>Download PDF</button>
  </div>

  <section class="notes" aria-label="Goals, rewards and notes">
    <div class="note"><div class="note-head"><span class="label">Key goals</span><span class="note-btns"><button class="mini" id="note-rem-0" type="button" aria-label="Remove a line from Key goals">&minus;</button><button class="mini" id="note-add-0" type="button" aria-label="Add a line to Key goals">+ Line</button></span></div><textarea id="note-0" aria-label="Key goals" spellcheck="false"></textarea></div>
    <div class="note"><div class="note-head"><span class="label">Contract &amp; reward</span><span class="note-btns"><button class="mini" id="note-rem-1" type="button" aria-label="Remove a line from Contract and reward">&minus;</button><button class="mini" id="note-add-1" type="button" aria-label="Add a line to Contract and reward">+ Line</button></span></div><textarea id="note-1" aria-label="Contract and reward" spellcheck="false"></textarea></div>
    <div class="note"><div class="note-head"><span class="label">Notes</span><span class="note-btns"><button class="mini" id="note-rem-2" type="button" aria-label="Remove a line from Notes">&minus;</button><button class="mini" id="note-add-2" type="button" aria-label="Add a line to Notes">+ Line</button></span></div><textarea id="note-2" aria-label="Notes" spellcheck="false"></textarea></div>
  </section>

  <section class="sheet" aria-label="Daily habits">
    <div class="checkin" id="checkin">
      <div class="ci-top">
        <button class="ghost" id="ci-prev" type="button" aria-label="Previous day">&lsaquo;</button>
        <div class="ci-daylabel"><span class="label">Check-in for</span><b id="ci-day">Day 1</b></div>
        <button class="ghost" id="ci-next" type="button" aria-label="Next day">&rsaquo;</button>
      </div>
      <p class="ci-q" id="ci-q" aria-live="polite"></p>
      <div class="ci-btns" id="ci-btns">
        <button class="yes" id="ci-yes" type="button" aria-pressed="false">Yes, done</button>
        <button class="no" id="ci-no" type="button" aria-pressed="false">No, missed</button>
      </div>
      <button class="ghost" id="ci-more" type="button" hidden>Answer the rest</button>
      <div class="ci-foot">
        <button class="linkbtn" id="ci-back" type="button">Back</button>
        <span id="ci-prog"></span>
        <button class="linkbtn" id="ci-skip" type="button">Skip</button>
      </div>
    </div>
    <div class="habitbar">
      <span class="label" id="hb-count">10 habits</span>
      <div class="hb-btns">
        <button class="ghost" id="hb-remove" type="button">Remove last</button>
        <button class="ghost solid" id="hb-add" type="button">+ Add habit</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="habits">
        <div class="habits-head label">Daily habits</div>
        <div class="habit-rows" id="habit-rows"></div>
      </div>
      <div class="scroll">
        <div class="tracker">
          <svg id="ring" viewBox="0 0 640 660" role="group" aria-label="Circular habit tracker, 31 days by 10 habits"></svg>
          <div class="center">
            <span class="label">Month of</span>
            <input id="month" type="text" aria-label="Month" spellcheck="false">
            <span class="pct"><b id="pct">0%</b> done</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="sleep" aria-label="Sleep tracker">
    <div class="sleep-title">
      <h2>SLEEP TRACKER</h2>
      <span class="stat"><b id="nights">0</b> nights logged &middot; average <b id="avg">&ndash;</b></span>
    </div>
    <div class="sleep-scroll"><table id="sleep"></table></div>
  </section>

  <div class="foot">
    <p class="hint">Saved in this browser on this device.</p>
    <button class="ghost" id="clear" type="button">Clear this month</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
